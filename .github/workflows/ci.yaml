---
name: Go CI

on: 
  push: 
    branches: 
      - main
      - master
      - feature/**

  pull_request: 
    branches:
      - main
      - master
      - feature/**

permissions: 
  contents: read

jobs: 
  build-and-check:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -v ./...

      - name: Summary
        run: |
          echo "All checks done"
